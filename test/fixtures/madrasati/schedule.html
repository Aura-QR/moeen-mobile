<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<!-- Verbatim from the real Madrasati page: this is the tag that was beating ours. -->
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>مدرستي | الجدول الأسبوعي للمعلم</title>
<!-- Real Madrasati is a Bootstrap 5 app, so its lg breakpoint (992px) is live. -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<style>
 body{font-family:Tahoma,sans-serif;background:#f4f6f8}
 .calendar-table{width:100%;border-collapse:collapse;background:#fff}
 .calendar-table th,.calendar-table td{border:1px solid #dde3ea;padding:10px;vertical-align:top}
 .day-cell div[data-data]{background:#eef5ff;border:1px solid #cfe0ff;border-radius:8px;padding:10px;min-width:150px}
 .day-cell h3{margin:0 0 4px;font-size:14px}
 .meta{font-size:11px;color:#667}
 /* The desktop table is revealed at lg, exactly the gate our viewport must clear. */
 .schedule-desktop{display:none}
 @media (min-width: 992px){ .schedule-desktop{display:block} .schedule-mobile{display:none} }
</style>
</head>
<body>
<header class="main-header bg-primary text-white p-3"><strong>مدرستي — Madrasati</strong></header>
<nav class="navbar bg-light px-3 py-2">الرئيسية · المقررات · الجدول</nav>

<!-- Mobile layout: what a teacher gets when the viewport override fails. -->
<div class="schedule-mobile p-3"><h4>عرض الجوال — الجدول غير متاح</h4></div>

<div class="schedule-desktop p-3">
<h1 class="h5 text-primary">جدول الحصص الأسبوعي</h1>
<table class="calendar-table">
  <thead><tr><th>الحصة</th><th>الأحد</th><th>الاثنين</th></tr></thead>
  <tbody>
    <tr>
      <td>الأولى</td>
      <td class="day-cell"><div data-data="TT-1001" data-subject-id="86"><h3>القيم الإسلامية</h3><div class="meta">فصل 1/أ</div></div></td>
      <td class="day-cell"><div data-data="TT-1002" data-subject-id="90"><h3>لغتي الجميلة</h3><div class="meta">فصل 1/ب</div></div></td>
    </tr>
    <tr>
      <td>الثانية</td>
      <td class="day-cell"><div data-data="TT-1003" data-subject-id="95"><h3>الرياضيات</h3><div class="meta">فصل 2/أ</div></div></td>
      <td class="day-cell"><span class="meta">—</span></td>
    </tr>
  </tbody>
</table>
</div>

<footer class="bg-dark text-white-50 p-3 mt-3 small">© وزارة التعليم</footer>

<script>
// Madrasati reads innerWidth at DOM ready to reflow parts of the page, so the
// viewport override has to have won by this point.
document.addEventListener('DOMContentLoaded', function(){
  console.log('MADRASATI_READY ' + JSON.stringify({
    innerWidthAtReady: window.innerWidth,
    desktopTableVisible: !!document.querySelector('.schedule-desktop') &&
      getComputedStyle(document.querySelector('.schedule-desktop')).display !== 'none',
    viewportTags: document.querySelectorAll('meta[name="viewport"]').length,
    winningViewport: (function(){
      var m = document.querySelectorAll('meta[name="viewport"]');
      return m.length ? m[m.length-1].getAttribute('content') : null;
    })()
  }));
});
setTimeout(function(){
  var cards = document.querySelectorAll('td.day-cell div[data-data]');
  console.log('REALMOCK ' + JSON.stringify({
    innerWidth: window.innerWidth,
    mqMinW992: window.matchMedia('(min-width: 992px)').matches,
    desktopVisible: getComputedStyle(document.querySelector('.schedule-desktop')).display !== 'none',
    cards: cards.length,
    dropdowns: document.querySelectorAll('.Moeen-2-dashboard-select').length
  }));
}, 10000);
</script>

<script>
// SCALEPROBE — Hader's own UI is counter-scaled against the page zoom; this
// reports whether it ended up at a readable size rather than a third of one.
setTimeout(function(){
  var panel = document.getElementById('Moeen-2-dashboard-panel');
  var sel   = document.querySelector('.Moeen-2-dashboard-select');
  var pageScale = screen.width / window.innerWidth;      // ~0.31
  function onScreen(el){ // rendered size in device px
    if (!el) return null;
    var r = el.getBoundingClientRect();
    return { w: Math.round(r.width * pageScale), h: Math.round(r.height * pageScale) };
  }
  console.log('SCALEPROBE ' + JSON.stringify({
    innerWidth: window.innerWidth,
    screenWidth: screen.width,
    expectedScale: +(window.innerWidth / screen.width).toFixed(2),
    panelTransform: panel ? panel.style.transform : null,
    panelOnScreen: onScreen(panel),
    selectFontPx: sel ? Math.round(parseFloat(getComputedStyle(sel).fontSize) * pageScale) : null,
    toggle: !!document.querySelector('.hader-panel-toggle')
  }));
}, 14000);
</script>
</body>
</html>
